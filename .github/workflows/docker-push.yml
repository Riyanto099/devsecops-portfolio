name: DevSecOps Build Scan and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devsecops-portfolio:${{ github.sha }} .

      - name: Save image
        run: docker save devsecops-portfolio:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-image
          path: image.tar
          retention-days: 1

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: devsecops-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash Static Analysis
        run: shellcheck scripts/linux-hardening.sh

      - name: Kubernetes Configuration Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: k8s/
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: devsecops-portfolio:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  push:
    name: Push Verified Image
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name != 'pull_request'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: devsecops-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push verified image
        run: |
          docker tag devsecops-portfolio:${{ github.sha }} riyanto02/devsecops-portfolio:latest
          docker tag devsecops-portfolio:${{ github.sha }} riyanto02/devsecops-portfolio:sha-${{ github.sha }}
          docker push riyanto02/devsecops-portfolio:latest
          docker push riyanto02/devsecops-portfolio:sha-${{ github.sha }}
