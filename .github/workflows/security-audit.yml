
name: DevSecOps Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Bash Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash script
        run: shellcheck scripts/linux-hardening.sh

  trivy-config:
    name: Kubernetes Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy configuration scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: k8s/
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  trivy-image:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: nginx:1.28
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
