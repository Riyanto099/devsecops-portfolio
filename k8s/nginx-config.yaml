apiVersion: v1
kind: ConfigMap
metadata:
  name: devsecops-nginx-config
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
